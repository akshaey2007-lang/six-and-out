services:
  - type: web
    name: six-and-out
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: six-and-out-db
          property: connectionString
databases:
  - name: six-and-out-db
    plan: free
    region: singapore
    databaseName: six_and_out
    user: six_and_out
    ipAllowList: []
